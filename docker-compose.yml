services:
  mercedes-spring-app:
    build: . # Compiles the Dockerfile in the current directory
    container_name: Mercedes-Spring-REST-API
    ports:
      - "8080:8080" # Maps port 8080 on your laptop to port 8080 in the container
    environment:
      # These exact variable names override your application.properties automatically
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_dev_db:5432/Mercedes_dev_db #your_existing_postgres_container_name(which runs on same network):5432/your_db_name
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=Admin@789
    networks:
      - mercedes_network # Attaches this container to your database network

  #need to add DB service here.

networks:
  mercedes_network:
    external: true # Tells Docker Compose that the network already exists outside this file -> Your DB or other container may be running on this network;
    name: postgre_dev_db_mercedes_network # Replace with the actual name of your network
