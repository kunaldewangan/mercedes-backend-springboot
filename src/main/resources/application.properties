spring.application.name=RESTdevelopment


# Database URL (Default port for Postgres is 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/Mercedes_dev_db
spring.datasource.username=admin
spring.datasource.password=Admin@789

# Hibernate Properties

# Driver Class (Optional but helps resolve 'undefined' errors)
spring.datasource.driver-class-name=org.postgresql.Driver

# 'update' will automatically create/update tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Standard PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect




